<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050509">
<title>Для Динары</title>
<style>
:root { --ground: #050509; --ink: #f5ece6; --red: #e8112d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(520px circle at 50% 18%, rgba(232, 17, 45, 0.18), transparent 70%);
}
.avatar {
  position: relative; z-index: 1; flex: none;
  width: clamp(96px, 28vw, 140px); aspect-ratio: 1; border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(245, 236, 230, 0.85);
  box-shadow: 0 0 0 6px rgba(232, 17, 45, 0.25), 0 12px 40px rgba(232, 17, 45, 0.35);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage { position: relative; z-index: 1; flex: 1; width: 100%; max-width: 560px; display: grid; place-items: center; min-height: 0; padding-top: 24px; }
.video {
  position: relative; width: fit-content; max-width: 100%; max-height: 100%; border-radius: 20px; overflow: hidden;
  background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.video video { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100dvh - 220px); filter: brightness(0.72); }
.video video { pointer-events: none; }
/* photo burst that replaces the picture (sound keeps playing) once the "во всех вселенных" subtitle is over */
.flash { position: absolute; inset: 0; z-index: 1; display: none; background: #000; pointer-events: none; }
.flash.on { display: block; }
.flash img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; filter: brightness(0.72); }
.gate { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: rgba(5, 5, 9, 0.62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: opacity 0.35s ease; }
.gate.hide { opacity: 0; pointer-events: none; }
.gate-card { width: min(300px, 100%); }
.gate-card button { appearance: none; border: 0; cursor: pointer; width: 100%; padding: 18px 20px; border-radius: 999px; background: var(--red); color: #fff; font: inherit; font-size: 19px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(232, 17, 45, 0.45); -webkit-tap-highlight-color: transparent; }
.gate-card button:active { transform: scale(0.98); }
/* light darkening veil over the video */
.video::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: rgba(5, 5, 9, 0.22); }
</style>
</head>
<body>
<div class="avatar"><img src="avatar.jpg" alt="Динары"></div>
<main class="stage">
  <div class="video">
    <video id="v" src="video.mp4" loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noremoteplayback"></video>
    <div class="flash" id="flash" aria-hidden="true"><img id="fi" alt=""></div>
  </div>
</main>
<div class="gate" id="gate" role="dialog" aria-label="Я готова">
  <div class="gate-card">
    <button type="button" id="go">Я готова</button>
  </div>
</div>
<script>
const v = document.getElementById("v");
// Photo burst: from START seconds flip through all photos, STEP seconds each, looping.
const START = 21.0, STEP = 0.4;
const PHOTOS = ["p/01.jpg", "p/02.jpg", "p/03.jpg", "p/04.jpg", "p/05.jpg", "p/06.jpg", "p/07.jpg", "p/08.jpg", "p/09.jpg"];
PHOTOS.forEach(src => { new Image().src = src; });
const flash = document.getElementById("flash"), fi = document.getElementById("fi");
let shown = -1;
function tick() {
  const t = v.currentTime;
  if (t >= START) {
    const i = Math.floor((t - START) / STEP) % PHOTOS.length;
    if (i !== shown) { fi.src = PHOTOS[i]; shown = i; }
    flash.classList.add("on");
  } else if (shown !== -1) { flash.classList.remove("on"); shown = -1; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// A tap is required for sound: the gate button starts the video from the beginning with audio on.
const gate = document.getElementById("gate");
document.getElementById("go").addEventListener("click", () => {
  v.muted = false; v.volume = 1; v.currentTime = 0;
  v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  gate.classList.add("hide");
  setTimeout(() => gate.remove(), 400);
});
</script>
</body>
</html>
